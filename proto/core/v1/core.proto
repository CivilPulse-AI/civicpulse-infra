syntax = "proto3";

package core.v1;

option go_package = "github.com/CivilPulse-AI/civicpulse-server/internal/pb/core/v1;corev1";

import "core/v1/ack.proto";
import "core/v1/call.proto";
import "core/v1/survey.proto";

// CoreIngest is implemented by civicpulse-server. Workers push completed
// background work here instead of talking to each other.
service CoreIngest {
  rpc IngestSurveyResults(SurveyResultsRequest) returns (IngestAck);
  rpc IngestCallEvent(CallEventRequest) returns (IngestAck);
}
