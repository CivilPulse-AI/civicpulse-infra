syntax = "proto3";

package ai.v1;

option go_package = "github.com/CivilPulse-AI/civicpulse-server/internal/pb/ai/v1;aiv1";

message TranscribeRequest {
  bytes audio = 1;
  string mime_type = 2;
  string language_hint = 3;
}

message TranscribeResponse {
  string text = 1;
  string language = 2;
  string english_text = 3;
}
