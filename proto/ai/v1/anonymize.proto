syntax = "proto3";

package ai.v1;

option go_package = "github.com/CivilPulse-AI/civicpulse-server/internal/pb/ai/v1;aiv1";

message AnonymizeImageRequest {
  bytes image = 1;
  string mime_type = 2;
}

message AnonymizeImageResponse {
  bytes image = 1;
  string mime_type = 2;
  int32 faces_blurred = 3;
  int32 plates_blurred = 4;
}
