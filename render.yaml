# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# CivicPulse AI — Render Blueprint (free instance types only)
# Private services and background workers are paid-only, so AI / telephony /
# notifications are free web services. Redis is an external Upstash URL (REDIS_URL).

previews:
  generation: off

envVarGroups:
  - name: civicpulse-shared
    envVars:
      - key: SERVICE_VERSION
        value: "0.1.0"

services:
  - type: web
    runtime: docker
    name: civicpulse-api
    repo: https://github.com/CivilPulse-AI/civicpulse-server
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: civicpulse-shared
      - key: SERVICE_NAME
        value: civicpulse-server
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PII_HASH_SECRET
        sync: false
      - key: PLATFORM_ADMIN_KEY
        sync: false
      - key: INSTITUTION_EMAIL_DOMAINS
        sync: false
      - key: OTP_REVEAL
        value: "false"
      - key: HACKATHON_DEMO
        value: "false"
      - key: GRPC_INGEST_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_SMS_ENABLED
        value: "false"
      - key: OTP_WHATSAPP_ENABLED
        value: "false"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: FAST2SMS_WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: FAST2SMS_WHATSAPP_TEMPLATE
        sync: false
      - key: GRPC_PORT
        value: "9090"
      - key: AI_GRPC_PORT
        value: "50051"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: GOADMIN_DATABASE_URL
        sync: false
      - key: GOADMIN_PASSWORD
        sync: false
      - key: MEDIA_STORE_PATH
        value: /data/media
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: AUDIT_DELAY_HOURS
        value: "24"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TELEPHONY_INTERNAL_URL
        sync: false
      - key: TELEPHONY_PUBLIC_WS_URL
        sync: false
      - key: SURVEY_STARTER_CREDITS
        value: "5000"
      - key: WORLDPOP_STATS_URL
        value: https://api.worldpop.org/v1/services/stats
      - key: WORLDPOP_API_KEY
        sync: false
      - key: ANOMALY_SCAN_MINUTES
        value: "15"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_CALLBACK_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AI_GRPC_HOST
        fromService:
          name: civicpulse-ai
          type: web
          property: host
      - key: AI_HEALTH_HOST
        fromService:
          name: civicpulse-ai
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: TELEPHONY_HEALTH_HOST
        fromService:
          name: civicpulse-telephony
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: NOTIFICATION_HEALTH_HOST
        fromService:
          name: civicpulse-notifications
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  - type: web
    runtime: docker
    name: civicpulse-ai
    repo: https://github.com/CivilPulse-AI/civicpulse-ai-service
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: civicpulse-shared
      - key: SERVICE_NAME
        value: civicpulse-ai-service
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false

  - type: web
    runtime: docker
    name: civicpulse-telephony
    repo: https://github.com/CivilPulse-AI/civicpulse-telephony-service
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: civicpulse-shared
      - key: SERVICE_NAME
        value: civicpulse-telephony-service
      - key: REDIS_URL
        sync: false
      - key: CORE_GRPC_HOST
        fromService:
          name: civicpulse-api
          type: web
          property: host
      - key: CORE_GRPC_PORT
        value: "9090"
      - key: GRPC_INGEST_TOKEN
        sync: false
      - key: CORE_HTTP_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RELAY_MODEL
        value: gemini-3.8-flash
      - key: LIVE_MODEL
        value: gemini-3.8-live
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false

  - type: web
    runtime: docker
    name: civicpulse-notifications
    repo: https://github.com/CivilPulse-AI/civicpulse-notification-service
    region: singapore
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: civicpulse-shared
      - key: SERVICE_NAME
        value: civicpulse-notification-service
      - key: REDIS_URL
        sync: false
      - key: FCM_SERVER_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: CivicPulse
      - key: BREVO_TEMPLATE_SLA_ESCALATION
        value: "5"
      - key: BREVO_TEMPLATE_WEEKLY_DIGEST
        value: "6"
